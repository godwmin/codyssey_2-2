<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랜덤 룰렛 &amp; 추첨기</title>
  <style>
    /* ==========================================================================
       1. 디자인 토큰 및 기본 스타일 (외부 글꼴/라이브러리/이미지 일절 미사용)
       ========================================================================== */
    :root {
      --bg-page: #f4f6fb;
      --bg-card: #ffffff;
      --bg-sub: #f8fafc;
      --bg-muted: #f1f5f9;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --border-focus: #4f46e5;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --success: #10b981;
      --success-soft: #ecfdf5;
      --warning: #f59e0b;
      --warning-soft: #fffbeb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-soft: #fef2f2;
      --shadow-md: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================================================
       2. 레이아웃 구조 (수정 기록 3: 모바일/좁은 창 반응형 1단 전환 및 여백 최적화)
       ========================================================================== */
    .app-container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 12px 40px;
    }

    .app-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .app-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .app-subtitle {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (min-width: 640px) {
      .app-container {
        padding: 24px 18px 48px;
      }
      .app-title {
        font-size: 1.65rem;
      }
      .app-subtitle {
        font-size: 0.92rem;
      }
      .main-grid {
        gap: 20px;
      }
    }

    @media (min-width: 900px) {
      .app-container {
        padding: 32px 24px 56px;
      }
      .main-grid {
        grid-template-columns: 380px 1fr;
        gap: 24px;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 18px;
    }

    @media (min-width: 640px) {
      .card {
        padding: 22px;
      }
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* ==========================================================================
       3. 공통 버튼 & 폼 컨트롤 (수정 기록 3: 터치·클릭 최소 높이 및 줄바꿈 방지)
       ========================================================================== */
    button {
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 0.16s ease, transform 0.1s ease, opacity 0.16s ease, box-shadow 0.16s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
      min-height: 44px;
      padding: 0 16px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.46;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-spin {
      width: 100%;
      max-width: 320px;
      min-height: 52px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.28);
    }

    .btn-spin:hover:not(:disabled) {
      background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.36);
    }

    .btn-exclude {
      background-color: var(--warning-soft);
      color: #b45309;
      border: 1px solid #fde68a;
      min-height: 44px;
      padding: 0 16px;
    }

    .btn-exclude:hover:not(:disabled) {
      background-color: #fef3c7;
    }

    .btn-reset {
      background-color: var(--bg-muted);
      color: var(--text-sub);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      min-height: 38px;
      padding: 0 12px;
    }

    .btn-reset:hover:not(:disabled) {
      background-color: var(--danger-soft);
      color: var(--danger);
      border-color: #fecaca;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--text-muted);
      min-height: 36px;
      padding: 0 10px;
      font-size: 0.84rem;
      border-radius: 6px;
    }

    .btn-delete:hover:not(:disabled) {
      background-color: var(--danger-soft);
      color: var(--danger);
    }

    /* ==========================================================================
       4. 좌측 패널: 후보 입력 및 목록
       ========================================================================== */
    .input-group {
      display: flex;
      gap: 8px;
    }

    .candidate-input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background-color: var(--bg-sub);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.16s ease, background-color 0.16s ease;
    }

    .candidate-input:focus {
      border-color: var(--border-focus);
      background-color: #ffffff;
    }

    .candidate-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .validation-msg {
      min-height: 22px;
      font-size: 0.84rem;
      font-weight: 600;
      margin-top: 6px;
      color: var(--danger);
      display: flex;
      align-items: center;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--primary);
      background-color: var(--primary-soft);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .candidate-list-wrapper {
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      max-height: 460px;
      overflow-y: auto;
    }

    .candidate-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .candidate-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      background-color: var(--bg-sub);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: background-color 0.15s ease;
    }

    .candidate-item.is-excluded {
      background-color: #f8fafc;
      border-style: dashed;
    }

    .candidate-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .color-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .candidate-item.is-excluded .color-dot {
      background-color: #cbd5e1 !important;
    }

    .candidate-name {
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .candidate-item.is-excluded .candidate-name {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .excluded-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      background-color: #e2e8f0;
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 28px 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ==========================================================================
       5. 우측 패널: 룰렛 원판, 포인터, 당첨 결과 및 기록
       ========================================================================== */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (min-width: 640px) {
      .right-column {
        gap: 20px;
      }
    }

    .roulette-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
    }

    .wheel-wrapper {
      position: relative;
      width: 100%;
      max-width: 390px;
      aspect-ratio: 1 / 1;
      margin: 6px auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 상단(12시 방향) 고정 포인터 */
    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 34px;
      height: 40px;
      filter: drop-shadow(0 3px 5px rgba(15, 23, 42, 0.28));
      pointer-events: none;
    }

    .wheel-canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12), 0 0 0 6px #ffffff, 0 0 0 8px var(--border);
    }

    .status-guide {
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      text-align: center;
      min-height: 24px;
      word-break: keep-all;
    }

    .status-guide.is-warning {
      color: #d97706;
    }

    .status-guide.is-active {
      color: var(--primary);
    }

    /* 최신 당첨 결과 영역 (수정 기록 3: 좁은 화면에서도 버튼이 찌그러지지 않게 배치) */
    .result-box {
      margin-top: 18px;
      width: 100%;
      background-color: var(--bg-sub);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 420px) {
      .result-box {
        flex-direction: column;
        align-items: stretch;
      }
      .result-box .btn-exclude {
        width: 100%;
      }
    }

    .result-box.has-winner {
      background-color: var(--primary-soft);
      border-color: #c7d2fe;
    }

    .result-info {
      min-width: 0;
      flex: 1;
    }

    .result-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .result-value {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-muted);
      word-break: break-all;
    }

    .result-box.has-winner .result-value {
      color: var(--primary);
    }

    /* 추첨 기록 영역 */
    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background-color: var(--bg-sub);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.93rem;
      animation: fadeSlideIn 0.25s ease;
    }

    .history-item:first-child {
      background-color: var(--success-soft);
      border-color: #a7f3d0;
      font-weight: 700;
    }

    .history-round {
      color: var(--text-sub);
      font-weight: 600;
      margin-right: 8px;
    }

    .history-name {
      color: var(--text-main);
      font-weight: 700;
      word-break: break-all;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">
        <!-- 인라인 SVG 아이콘 -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="#4f46e5" stroke-width="2.2" fill="#eef2ff" />
          <path d="M12 2V12L19.07 19.07" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" />
          <circle cx="12" cy="12" r="2.5" fill="#4f46e5" />
        </svg>
        랜덤 룰렛 &amp; 추첨기
      </h1>
      <p class="app-subtitle">후보를 등록하고 공정한 확률로 추첨 결과를 확인하세요 (현재 세션 기준)</p>
    </header>

    <main class="main-grid">
      <!-- ======================================================================
           좌측 영역: 후보 입력창, '추가' 버튼, 유효성 안내, 참여 수, 후보 목록
           ====================================================================== -->
      <section class="card" aria-label="후보 관리">
        <div class="section-header">
          <h2 class="section-title">후보 등록 및 목록</h2>
          <span id="activeCountBadge" class="count-badge">참여 후보 0명</span>
        </div>

        <form id="candidateForm" class="input-group" novalidate>
          <input
            type="text"
            id="candidateInput"
            class="candidate-input"
            placeholder="후보 이름 입력 (예: 김밥)"
            autocomplete="off"
            aria-label="후보 이름 입력"
          />
          <button type="submit" id="addBtn" class="btn-primary">추가</button>
        </form>

        <div id="validationMsg" class="validation-msg" role="alert" aria-live="polite"></div>

        <div class="candidate-list-wrapper">
          <ul id="candidateList" class="candidate-list"></ul>
          <div id="emptyCandidateMsg" class="empty-state">
            등록된 후보가 없습니다.<br />위 입력창에서 후보를 추가해 주세요.
          </div>
        </div>
      </section>

      <!-- ======================================================================
           우측 영역: 룰렛, 포인터, 돌리기 버튼, 최신 당첨 결과, 제외하기, 기록
           ====================================================================== -->
      <div class="right-column">
        <section class="card roulette-stage" aria-label="룰렛 추첨">
          <div class="wheel-wrapper">
            <!-- 12시 방향 고정 포인터 (인라인 SVG) -->
            <svg class="wheel-pointer" viewBox="0 0 36 42" fill="none" aria-hidden="true">
              <path
                d="M18 40L4 14C2.2 10.6 4.6 6 8.5 6H27.5C31.4 6 33.8 10.6 32 14L18 40Z"
                fill="#ef4444"
                stroke="#ffffff"
                stroke-width="2.5"
                stroke-linejoin="round"
              />
              <circle cx="18" cy="14" r="3.5" fill="#ffffff" />
            </svg>
            <canvas id="rouletteCanvas" class="wheel-canvas"></canvas>
          </div>

          <button type="button" id="spinBtn" class="btn-spin" disabled>
            룰렛 돌리기
          </button>

          <p id="statusGuide" class="status-guide is-warning" aria-live="polite">
            후보를 2개 이상 추가해 주세요
          </p>

          <!-- 최신 당첨 결과 & 제외하기 버튼 -->
          <div id="resultBox" class="result-box">
            <div class="result-info">
              <div class="result-label">최신 당첨 결과</div>
              <div id="latestResultText" class="result-value">-</div>
            </div>
            <button type="button" id="excludeBtn" class="btn-exclude" disabled>
              제외하기
            </button>
          </div>
        </section>

        <!-- 추첨 기록 & 전체 초기화 -->
        <section class="card" aria-label="추첨 기록">
          <div class="section-header">
            <h2 class="section-title">추첨 기록</h2>
            <button type="button" id="resetAllBtn" class="btn-reset">
              전체 초기화
            </button>
          </div>

          <ul id="historyList" class="history-list"></ul>
          <div id="emptyHistoryMsg" class="empty-state">
            아직 추첨 기록이 없습니다.
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      /* ========================================================================
         1. 애플리케이션 상태 (메모리 내 상태만 유지 - 영구 저장 미사용)
         ======================================================================== */
      const state = {
        candidates: [],       // { id: number, name: string, excluded: boolean, color: string }
        nextCandidateId: 1,
        history: [],          // { round: number, candidateId: number, name: string }
        latestWinner: null,   // { candidateId: number, name: string } | null
        isSpinning: false,
        currentRotation: 0,   // 라디안 단위 누적 회전 각도
        hasSpunAtLeastOnce: false
      };

      // 시인성이 뛰어난 색상 팔레트 (후보 수 상한 없이 순환 적용)
      const SLICE_PALETTE = [
        "#6366f1", "#ec4899", "#14b8a6", "#f59e0b",
        "#3b82f6", "#8b5cf6", "#10b981", "#f97316",
        "#06b6d4", "#ef4444", "#84cc16", "#d946ef"
      ];

      /* ========================================================================
         2. DOM 요소 참조
         ======================================================================== */
      const dom = {
        candidateForm: document.getElementById("candidateForm"),
        candidateInput: document.getElementById("candidateInput"),
        addBtn: document.getElementById("addBtn"),
        validationMsg: document.getElementById("validationMsg"),
        activeCountBadge: document.getElementById("activeCountBadge"),
        candidateList: document.getElementById("candidateList"),
        emptyCandidateMsg: document.getElementById("emptyCandidateMsg"),
        canvas: document.getElementById("rouletteCanvas"),
        spinBtn: document.getElementById("spinBtn"),
        statusGuide: document.getElementById("statusGuide"),
        resultBox: document.getElementById("resultBox"),
        latestResultText: document.getElementById("latestResultText"),
        excludeBtn: document.getElementById("excludeBtn"),
        historyList: document.getElementById("historyList"),
        emptyHistoryMsg: document.getElementById("emptyHistoryMsg"),
        resetAllBtn: document.getElementById("resetAllBtn")
      };

      const ctx = dom.canvas.getContext("2d");

      /* ========================================================================
         3. Web Audio API 효과음 생성기 (외부 음원 파일 없음)
         ======================================================================== */
      let audioCtx = null;

      function playWinSound() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;

          if (!audioCtx) {
            audioCtx = new AudioContextClass();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now + idx * 0.075);

            gain.gain.setValueAtTime(0.001, now + idx * 0.075);
            gain.gain.exponentialRampToValueAtTime(0.16, now + idx * 0.075 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.075 + 0.28);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now + idx * 0.075);
            osc.stop(now + idx * 0.075 + 0.3);
          });
        } catch (err) {
          // 오디오 차단 환경 무시
        }
      }

      /* ========================================================================
         4. 유틸리티 및 상태 조회 함수
         ======================================================================== */
      function getActiveCandidates() {
        return state.candidates.filter((item) => !item.excluded);
      }

      function pickColorForIndex(index) {
        return SLICE_PALETTE[index % SLICE_PALETTE.length];
      }

      function setValidationMessage(msg) {
        dom.validationMsg.textContent = msg || "";
      }

      /* ========================================================================
         5. 고해상도(DPR) 캔버스 대응 및 룰렛 원판 렌더링
            (수정 기록 1: 반지름 기반 최대 폭 계산, 자동 말줄임, 동적 폰트 축소)
         ======================================================================== */
      function resizeCanvas() {
        const wrapper = dom.canvas.parentElement;
        const size = wrapper.clientWidth || 360;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        dom.canvas.width = size * dpr;
        dom.canvas.height = size * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        drawRoulette();
      }

      function drawRoulette() {
        const wrapper = dom.canvas.parentElement;
        const size = wrapper.clientWidth || 360;
        const center = size / 2;
        const radius = center - 6;
        const hubRadius = 22;

        ctx.clearRect(0, 0, size, size);

        const active = getActiveCandidates();
        const count = active.length;

        if (count === 0) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(center, center, radius, 0, Math.PI * 2);
          ctx.fillStyle = "#f1f5f9";
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#cbd5e1";
          ctx.stroke();

          ctx.fillStyle = "#94a3b8";
          ctx.font = "600 15px " + getComputedStyle(document.body).fontFamily;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("후보를 추가해 주세요", center, center);
          ctx.restore();
          return;
        }

        const sliceAngle = (Math.PI * 2) / count;

        for (let i = 0; i < count; i++) {
          const candidate = active[i];
          const startAngle = state.currentRotation + i * sliceAngle;
          const endAngle = startAngle + sliceAngle;

          // 마지막 칸이 첫 칸과 색상이 겹치지 않도록 보정
          let fillColor = candidate.color;
          if (count > 1 && i === count - 1 && fillColor === active[0].color) {
            fillColor = SLICE_PALETTE[(i + 1) % SLICE_PALETTE.length];
          }

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(center, center);
          ctx.arc(center, center, radius, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = fillColor;
          ctx.fill();

          ctx.lineWidth = count > 20 ? 1 : 2;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();

          // 텍스트 렌더링 (조각 중앙 각도 방향)
          const midAngle = startAngle + sliceAngle / 2;
          ctx.translate(center, center);
          ctx.rotate(midAngle);

          // 후보 수 및 캔버스 크기에 맞춘 동적 폰트 크기 계산
          const baseScale = size / 390;
          let rawFontSize = 15;
          if (count > 20) rawFontSize = 9.5;
          else if (count > 14) rawFontSize = 11;
          else if (count > 8) rawFontSize = 13;

          const fontSize = Math.max(8.5, Math.round(rawFontSize * baseScale * 10) / 10);
          ctx.font = `700 ${fontSize}px ${getComputedStyle(document.body).fontFamily}`;
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";

          ctx.shadowColor = "rgba(15, 23, 42, 0.35)";
          ctx.shadowBlur = 3;

          // 바깥 테두리와 중앙 허브 사이 안전 여백 내 최대 텍스트 폭 산출
          const textOuterRadius = radius - 14;
          const textInnerRadius = hubRadius + 12;
          const maxTextWidth = Math.max(textOuterRadius - textInnerRadius, 28);

          let label = candidate.name;
          if (ctx.measureText(label).width > maxTextWidth) {
            while (label.length > 1 && ctx.measureText(label + "…").width > maxTextWidth) {
              label = label.slice(0, -1);
            }
            label += "…";
          }

          ctx.fillText(label, textOuterRadius, 0);
          ctx.restore();
        }

        // 중앙 장식 허브
        ctx.save();
        ctx.beginPath();
        ctx.arc(center, center, hubRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#e2e8f0";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(center, center, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#4f46e5";
        ctx.fill();
        ctx.restore();
      }

      /* ========================================================================
         6. UI 전체 동기화 렌더링
         ======================================================================== */
      function renderAll() {
        const activeCandidates = getActiveCandidates();
        const activeCount = activeCandidates.length;
        const locked = state.isSpinning;

        // 1) 참여 후보 수 배지
        dom.activeCountBadge.textContent = `참여 후보 ${activeCount}명`;

        // 2) 입력창 및 추가 버튼 잠금 상태
        dom.candidateInput.disabled = locked;
        dom.addBtn.disabled = locked;

        // 3) 후보 목록 렌더링
        dom.candidateList.innerHTML = "";
        if (state.candidates.length === 0) {
          dom.emptyCandidateMsg.style.display = "block";
        } else {
          dom.emptyCandidateMsg.style.display = "none";
          state.candidates.forEach((candidate) => {
            const li = document.createElement("li");
            li.className = "candidate-item" + (candidate.excluded ? " is-excluded" : "");

            const infoDiv = document.createElement("div");
            infoDiv.className = "candidate-info";

            const dot = document.createElement("span");
            dot.className = "color-dot";
            dot.style.backgroundColor = candidate.color;

            const nameSpan = document.createElement("span");
            nameSpan.className = "candidate-name";
            nameSpan.textContent = candidate.name;
            nameSpan.title = candidate.name;

            infoDiv.appendChild(dot);
            infoDiv.appendChild(nameSpan);

            if (candidate.excluded) {
              const badge = document.createElement("span");
              badge.className = "excluded-badge";
              badge.textContent = "제외됨";
              infoDiv.appendChild(badge);
            }

            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "btn-delete";
            delBtn.textContent = "삭제";
            delBtn.disabled = locked;
            delBtn.setAttribute("aria-label", `${candidate.name} 삭제`);
            delBtn.addEventListener("click", () => handleDeleteCandidate(candidate.id));

            li.appendChild(infoDiv);
            li.appendChild(delBtn);
            dom.candidateList.appendChild(li);
          });
        }

        // 4) 룰렛 돌리기 버튼 및 상태 안내 문구
        if (locked) {
          dom.spinBtn.disabled = true;
          dom.statusGuide.textContent = "룰렛이 회전하고 있습니다...";
          dom.statusGuide.className = "status-guide is-active";
        } else if (activeCount < 2) {
          dom.spinBtn.disabled = true;
          if (state.candidates.length === 0 && !state.hasSpunAtLeastOnce) {
            dom.statusGuide.textContent = "후보를 2개 이상 추가해 주세요";
          } else {
            dom.statusGuide.textContent = "추첨에 참여할 후보가 2개 이상 필요합니다";
          }
          dom.statusGuide.className = "status-guide is-warning";
        } else {
          dom.spinBtn.disabled = false;
          dom.statusGuide.textContent = `총 ${activeCount}명의 후보 중 무작위로 1명을 추첨합니다`;
          dom.statusGuide.className = "status-guide";
        }

        // 5) 최신 당첨 결과 및 '제외하기' 버튼 활성화 여부
        if (state.latestWinner) {
          dom.resultBox.classList.add("has-winner");
          dom.latestResultText.textContent = state.latestWinner.name;

          const targetCandidate = state.candidates.find(
            (c) => c.id === state.latestWinner.candidateId
          );
          const canExclude = Boolean(targetCandidate && !targetCandidate.excluded && !locked);
          dom.excludeBtn.disabled = !canExclude;
        } else {
          dom.resultBox.classList.remove("has-winner");
          dom.latestResultText.textContent = "-";
          dom.excludeBtn.disabled = true;
        }

        // 6) 추첨 기록 렌더링 (최신 회차가 맨 위)
        dom.historyList.innerHTML = "";
        if (state.history.length === 0) {
          dom.emptyHistoryMsg.style.display = "block";
        } else {
          dom.emptyHistoryMsg.style.display = "none";
          for (let i = state.history.length - 1; i >= 0; i--) {
            const entry = state.history[i];
            const li = document.createElement("li");
            li.className = "history-item";

            const textSpan = document.createElement("span");
            const roundSpan = document.createElement("span");
            roundSpan.className = "history-round";
            roundSpan.textContent = `${entry.round}회차 -`;

            const winnerSpan = document.createElement("span");
            winnerSpan.className = "history-name";
            winnerSpan.textContent = entry.name;

            textSpan.appendChild(roundSpan);
            textSpan.appendChild(winnerSpan);
            li.appendChild(textSpan);
            dom.historyList.appendChild(li);
          }
        }

        // 7) 전체 초기화 버튼 잠금 상태
        dom.resetAllBtn.disabled = locked;

        // 8) 룰렛 캔버스 다시 그리기
        drawRoulette();
      }

      /* ========================================================================
         7. 이벤트 핸들러 (수정 기록 2: 오류 시 자동 focus() 및 select() 처리)
         ======================================================================== */
      function handleAddCandidate(event) {
        event.preventDefault();
        if (state.isSpinning) return;

        const trimmed = dom.candidateInput.value.trim();

        // 유효성 검사 1: 빈 문자열
        if (!trimmed) {
          setValidationMessage("항목을 입력해 주세요");
          dom.candidateInput.focus();
          dom.candidateInput.select();
          return;
        }

        // 유효성 검사 2: 중복 이름 검사 (제외된 항목도 삭제 전까지 포함)
        const isDuplicate = state.candidates.some((item) => item.name === trimmed);
        if (isDuplicate) {
          setValidationMessage("이미 등록된 항목입니다");
          dom.candidateInput.focus();
          dom.candidateInput.select();
          return;
        }

        // 정상 등록 (등록 개수 상한 제한 없음)
        setValidationMessage("");
        const colorIndex = state.nextCandidateId - 1;
        state.candidates.push({
          id: state.nextCandidateId++,
          name: trimmed,
          excluded: false,
          color: pickColorForIndex(colorIndex)
        });

        dom.candidateInput.value = "";
        dom.candidateInput.focus();
        renderAll();
      }

      function handleDeleteCandidate(id) {
        if (state.isSpinning) return;

        state.candidates = state.candidates.filter((item) => item.id !== id);
        setValidationMessage("");
        renderAll();
      }

      function handleSpin() {
        if (state.isSpinning) return;

        const activeCandidates = getActiveCandidates();
        if (activeCandidates.length < 2) {
          setValidationMessage("");
          renderAll();
          return;
        }

        setValidationMessage("");
        state.isSpinning = true;
        state.hasSpunAtLeastOnce = true;
        renderAll();

        // 동일 확률 무작위 추첨
        const count = activeCandidates.length;
        const winnerIndex = Math.floor(Math.random() * count);

        // 12시 포인터(1.5 * Math.PI)에 선택된 칸이 정지하도록 회전각 계산
        const sliceAngle = (Math.PI * 2) / count;
        const pointerAngle = Math.PI * 1.5;
        const safeJitter = (Math.random() - 0.5) * sliceAngle * 0.5;
        const targetSliceCenterOffset = (winnerIndex + 0.5) * sliceAngle + safeJitter;

        const twoPi = Math.PI * 2;
        const normalizedCurrent = ((state.currentRotation % twoPi) + twoPi) % twoPi;
        const desiredMod = (((pointerAngle - targetSliceCenterOffset) % twoPi) + twoPi) % twoPi;

        let deltaAngle = desiredMod - normalizedCurrent;
        if (deltaAngle < 0) {
          deltaAngle += twoPi;
        }

        const extraSpins = (6 + Math.floor(Math.random() * 3)) * twoPi;
        const startRotation = state.currentRotation;
        const totalDelta = extraSpins + deltaAngle;

        const duration = 3800;
        const startTime = performance.now();

        function easeOutQuart(t) {
          return 1 - Math.pow(1 - t, 4);
        }

        function animateFrame(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easeOutQuart(progress);

          state.currentRotation = startRotation + totalDelta * eased;
          drawRoulette();

          if (progress < 1) {
            requestAnimationFrame(animateFrame);
          } else {
            state.currentRotation = (startRotation + totalDelta) % twoPi;
            state.isSpinning = false;

            const actualWinner = getCandidateUnderPointer(activeCandidates);

            state.latestWinner = {
              candidateId: actualWinner.id,
              name: actualWinner.name
            };

            state.history.push({
              round: state.history.length + 1,
              candidateId: actualWinner.id,
              name: actualWinner.name
            });

            playWinSound();
            renderAll();
          }
        }

        requestAnimationFrame(animateFrame);
      }

      function getCandidateUnderPointer(activeCandidates) {
        const count = activeCandidates.length;
        const twoPi = Math.PI * 2;
        const sliceAngle = twoPi / count;
        const pointerAngle = Math.PI * 1.5;

        const relativeAngle = (((pointerAngle - state.currentRotation) % twoPi) + twoPi) % twoPi;
        const index = Math.floor(relativeAngle / sliceAngle) % count;
        return activeCandidates[index];
      }

      function handleExcludeLatestWinner() {
        if (state.isSpinning || !state.latestWinner) return;

        const target = state.candidates.find(
          (c) => c.id === state.latestWinner.candidateId
        );
        if (!target || target.excluded) return;

        target.excluded = true;
        setValidationMessage("");
        renderAll();
      }

      function handleResetAll() {
        if (state.isSpinning) return;

        state.candidates = [];
        state.nextCandidateId = 1;
        state.history = [];
        state.latestWinner = null;
        state.currentRotation = 0;
        state.hasSpunAtLeastOnce = false;

        dom.candidateInput.value = "";
        setValidationMessage("");
        renderAll();
        dom.candidateInput.focus();
      }

      /* ========================================================================
         8. 이벤트 바인딩 및 초기화
         ======================================================================== */
      dom.candidateForm.addEventListener("submit", handleAddCandidate);
      dom.candidateInput.addEventListener("input", () => {
        if (dom.validationMsg.textContent) {
          setValidationMessage("");
        }
      });
      dom.spinBtn.addEventListener("click", handleSpin);
      dom.excludeBtn.addEventListener("click", handleExcludeLatestWinner);
      dom.resetAllBtn.addEventListener("click", handleResetAll);
      window.addEventListener("resize", resizeCanvas);

      window.onload = function () {
        resizeCanvas();
        renderAll();
      };
    })();
  </script>
</body>
</html>
